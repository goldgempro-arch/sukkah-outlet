<style>

  :root[data-theme="dark"] {

    --bad:#f97066; --bad-bg:#3b1d1a; --good:#47cd89; --good-bg:#12301f; --warn:#f5b84a; --warn-bg:#3a2a0c; --row-alt:#1f242c; --c-over:#d95926; --c-spent:#3987e5; --c-ok:#199e70; --c-warn:#c98500; --c-pink:#d55181; --grid:#2a303a; color-scheme: dark; }

  .yeargroup { display:flex; flex-direction:column; gap:8px; }

  .acards { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr)); gap:10px; }
  .acard { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px; display:flex; flex-direction:column; gap:8px; min-width:0; }

  .acard .go { align-self:flex-start; }
  .note { font-size:12px; color:var(--muted); }
  #tip { position:fixed; z-index:50; pointer-events:none; background:var(--ink); color:var(--bg); padding:6px 9px; border-radius:6px; font-size:12px; max-width:260px; box-shadow:0 2px 8px rgba(0,0,0,.25); white-space:pre-line; }
  details.tbl summary { margin-bottom:8px; }
  .scroll { overflow-x:auto; }
  .stack { display:flex; flex-direction:column; gap:14px; }
  @media (max-width:520px) { .colw { min-width:74px; } .cols { gap:6px; } .colw .sub { font-size:10px; } .tile .v { font-size:24px; } .hrow { grid-template-columns:1fr auto; } .hrow .track { grid-column:1 / -1; order:3; } }
  @media (prefers-reduced-motion: no-preference) { .fill, .bars .seg, .stackbar .seg { transition:opacity .15s; } }

<script>
const $ = id => document.getElementById(id);
const num = v => { if (v === '' || v == null) return 0; const n = parseFloat(String(v).replace(/[$,]/g, '')); return isNaN(n) ? 0 : n; };
const money = n => (n < 0 ? '-' : '') + '$' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const usd = n => (n < 0 ? '-' : '') + '$' + Math.round(Math.abs(n)).toLocaleString('en-US');
const r2 = n => Math.round(n * 100) / 100;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tid = v => String(v ?? '').replace(/\.0$/, '').trim();
const wt = n => n ? n + ' lb' : '';
const safeGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const safeSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
function fmtDate(d) {
  if (typeof d === 'number') return new Date(Math.round((d - 25569) * 86400000)).toISOString().slice(0, 10);
  return String(d ?? '').slice(0, 10);
}
const SURCHARGE_FLAG = /oversize|add'?l handling|additional handling|large package|address correction|delivery area|^das|residential|saturday|demand|signature|declared value|duplicate|adjust/i;
const NORMAL = /^(fuel surcharge|discount|grace discount|earned discount|performance pricing|residential delivery|weekday delivery)$/i;
const CHUNK = 150;

let db = null, userNS = null, dl = null, canWrite = true, myId = null;
const S = { audits: [], id: null, sr: [], fx: [], status: new Map(), rows: [], unS: [], unF: [], names: {}, unsubStatus: null,
            filter: 'all', sortKey: 'diff', sortDir: -1, busy: false, view: 'home', homeYear: 'all' };

/* ---------- storage ---------- */
const auditsCol = () => db.collection('audits');
const chunkPath = (id, kind, n) => `audits/${id}/${kind}/${n}`;
async function writeChunks(id, kind, rows) {
  const n = Math.ceil(rows.length / CHUNK);
  for (let i = 0; i < n; i++) await db.doc(chunkPath(id, kind, i)).set({ rows: rows.slice(i * CHUNK, (i + 1) * CHUNK) });
  const old = await db.collection(`audits/${id}/${kind}`).get();
  for (const d of old.docs) if (Number(d.id) >= n) await db.doc(chunkPath(id, kind, d.id)).delete();
}
async function readChunks(id, kind) {
  const snap = await db.collection(`audits/${id}/${kind}`).get();
  return snap.docs.slice().sort((a, b) => Number(a.id) - Number(b.id)).flatMap(d => d.data().rows || []);
}
function totals() {
  const tol = num($('tol').value);
  const over = S.rows.filter(r => r.diff > tol);
  return { shipments: S.rows.length, over: over.length, overTotal: over.reduce((s, r) => s + r.diff, 0) };
}
async function saveAudit() {
  if (!db || !S.id) return;
  const t = totals();
  const invs = [...new Set(S.fx.map(r => r.inv))];
  await db.doc(`audits/${S.id}`).update({ invoices: invs, shipments: t.shipments, overCount: t.over, overTotal: Math.round(t.overTotal * 100) / 100, updatedAt: new Date().toISOString() });
  await writeChunks(S.id, 'sr', S.sr);
  await writeChunks(S.id, 'fx', S.fx);
}
async function openAudit(id) {
  if (S.unsubStatus) { S.unsubStatus(); S.unsubStatus = null; }
  S.id = id; S.sr = []; S.fx = []; S.status = new Map(); S.filter = 'all';
  $('files').textContent = '';
  if (id) safeSet('fedexAudit.last', id);
  applySettings(S.audits.find(a => a.id === id));
  if (!id) { analyze(); return; }
  if (db) {
    try {
      S.busy = true; $('msg').textContent = 'Loading saved audit…';
      [S.sr, S.fx] = await Promise.all([readChunks(id, 'sr'), readChunks(id, 'fx')]);
      $('msg').textContent = '';
      S.unsubStatus = db.collection(`audits/${id}/status`).onSnapshot(snap => {
        S.status = new Map(snap.docs.map(d => [d.id, d.data()]));
        render(); loadNames(); scheduleSum();
      }, e => { $('msg').textContent = 'Could not load dispute marks: ' + (e.message || e.code); });
    } catch (e) { $('msg').textContent = 'Could not load this audit: ' + (e.message || e.code); }
    S.busy = false;
  }
  analyze();
}

/* ---------- parsing (additive) ---------- */
async function readFile(file) {
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: false });
  return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '', raw: true });
}
async function handleFiles(list) {
  if (!S.id) { $('msg').textContent = 'Create or open an audit first, then add files.'; return; }
  if (!canWrite) { $('msg').textContent = 'You have view-only access, so files cannot be added.'; return; }
  $('msg').textContent = '';
  const newSR = [], newFX = [], names = [];
  for (const f of list) {
    try {
      const rows = await readFile(f), head = (rows[0] || []).map(String), idx = k => head.indexOf(k);
      if (head.includes('Shipment Tracking Number')) {
        const I = { t: idx('Shipment Tracking Number'), c: idx('Shipment Shipping Charges'), w: idx('Package Weight'), d: idx('Shipment Date'), o: idx('Order Number'),
                    n: idx('Ship To LastName'), l: idx('Package Size Length'), wd: idx('Package Size Width'), h: idx('Package Size Height') };
        let n = 0;
        for (const r of rows.slice(1)) {
          if (!r[I.t]) continue; n++;
          newSR.push({ t: tid(r[I.t]), q: num(r[I.c]), w: num(r[I.w]), d: fmtDate(r[I.d]), o: String(r[I.o] ?? ''), n: String(r[I.n] ?? ''), dm: [r[I.l], r[I.wd], r[I.h]].join('×') });
        }
        names.push(`${f.name}: ShipRush, ${n} rows`);
      } else if (head.includes('Express or Ground Tracking ID')) {
        const cD = head.map((h, i) => h === 'Tracking ID Charge Description' ? i : -1).filter(i => i >= 0);
        const I = { inv: idx('Invoice Number'), t: idx('Express or Ground Tracking ID'), m: idx('TDMasterTrackingID'), net: idx('Net Charge Amount'),
                    svc: idx('Ground Service'), rated: idx('Rated Weight Amount'), ship: idx('Shipment Date'), dl: idx('Dim Length'), dw: idx('Dim Width'), dh: idx('Dim Height') };
        let n = 0;
        for (const r of rows.slice(1)) {
          if (!r[I.t] || r[I.net] === '') continue; n++;
          const dims = [r[I.dl], r[I.dw], r[I.dh]].every(v => v !== '' && v != null) ? [r[I.dl], r[I.dw], r[I.dh]].join('×') : '';
          newFX.push({ i: String(r[I.inv] ?? ''), t: tid(r[I.t]), m: tid(r[I.m]) || tid(r[I.t]), n: num(r[I.net]), r: num(r[I.rated]), dm: dims, s: String(r[I.ship] ?? ''),
                       c: cD.map(i => [r[i], num(r[i + 1])]).filter(c => c[0]) });
        }
        names.push(`${f.name}: FedEx invoice, ${n} packages`);
      } else names.push(`${f.name}: not recognized, skipped`);
    } catch (e) { $('msg').textContent = `Could not read ${f.name}: ${e.message}`; }
  }
  // merge: ShipRush by tracking number (keep what is already saved), FedEx by invoice + tracking
  const haveSR = new Set(S.sr.map(r => r.t)), haveFX = new Set(S.fx.map(r => r.i + '|' + r.t));
  const addSR = newSR.filter(r => !haveSR.has(r.t)), addFX = newFX.filter(r => !haveFX.has(r.i + '|' + r.t));
  const dupFX = new Set(); const addFX2 = addFX.filter(r => { const k = r.i + '|' + r.t; if (dupFX.has(k)) return false; dupFX.add(k); return true; });
  S.sr = S.sr.concat(addSR); S.fx = S.fx.concat(addFX2);
  $('files').innerHTML = names.map(esc).join('<br>') + `<br>Added ${new Set(addSR.map(r => r.t)).size} new ShipRush shipments and ${addFX2.length} new FedEx packages.`;
  analyze();
  if (db && (addSR.length || addFX2.length)) {
    try { $('msg').textContent = 'Saving…'; await saveAudit(); $('msg').textContent = 'Saved.'; setTimeout(() => { if ($('msg').textContent === 'Saved.') $('msg').textContent = ''; }, 2500); }
    catch (e) { $('msg').textContent = 'Could not save: ' + (e.code === 'quota_exceeded' ? 'the storage limit is full. Delete an old audit and try again.' : (e.message || e.code)); }
  }
}

/* ---------- analysis ---------- */
function analyze() {
  const sr = new Map();
  for (const r of S.sr) {
    const s = sr.get(r.t);
    if (!s) sr.set(r.t, { ...r, pkgs: 1, tw: r.w, dimsAll: [r.dm] });
    else { s.pkgs++; s.tw += r.w; s.dimsAll.push(r.dm); }
  }
  const fx = new Map(), seen = new Set();
  for (const r of S.fx) {
    const key = r.i + '|' + r.t; if (seen.has(key)) continue; seen.add(key);
    let g = fx.get(r.m);
    if (!g) fx.set(r.m, g = { tracks: [], dims: [], invs: new Set(), net: 0, rated: 0, pkgs: 0, charges: new Map(), svc: r.svc });
    if (!g.tracks.includes(r.t)) g.tracks.push(r.t);
    if (r.dm) g.dims.push(r.dm);
    g.invs.add(r.i); g.net += r.n; g.rated += r.r; g.pkgs++;
    for (const [d, a] of r.c) g.charges.set(d, (g.charges.get(d) || 0) + a);
  }
  S.rows = []; S.unS = []; S.unF = [];
  for (const [t, s] of sr) {
    const f = fx.get(t);
    if (!f) { S.unS.push(s); continue; }
    const flags = [];
    const fl = [];
    for (const [d, a] of f.charges) if (SURCHARGE_FLAG.test(d) && !NORMAL.test(d) && a !== 0) { flags.push(`${d} ${money(a)}`); fl.push([d, a]); }
    S.rows.push({ track: t, tracks: f.tracks, order: s.o, name: s.n, date: s.d, quote: s.q, billed: f.net, diff: f.net - s.q,
                  shipWt: s.tw, billWt: f.rated, pkgsSR: s.pkgs, pkgsFX: f.pkgs, shipDims: s.dimsAll.join(' / '), billedDims: f.dims.join(' / '),
                  inv: [...f.invs].join(', '), flags, fl });
  }
  for (const [t, f] of fx) if (!sr.has(t)) S.unF.push({ t, net: f.net, svc: f.svc });
  render(); scheduleSum();
}

const pending = r => { const s = st(r); return !s.accepted && s.disp !== 'refunded' && s.disp !== 'rejected'; };
function statusLabel(r) { const s = st(r); return s.accepted ? 'accepted' : (s.disp || 'open'); }

}

/* ---------- summary, saved settings, views ---------- */
const stable = o => Array.isArray(o) ? '[' + o.map(stable).join(',') + ']' : (o && typeof o === 'object') ? '{' + Object.keys(o).sort().map(k => JSON.stringify(k) + ':' + stable(o[k])).join(',') + '}' : JSON.stringify(o);
function computeSum() {
  const tol = num($('tol').value), seen = new Set();
  let billed = 0;
  for (const r of S.fx) { const k = r.i + '|' + r.t; if (seen.has(k)) continue; seen.add(k); billed += r.n; }
  const over = S.rows.filter(r => r.diff > tol);
  const by = { open: 0, accepted: 0, filed: 0, refunded: 0, rejected: 0 }, ch = {};
  let recovered = 0;
  for (const r of over) {
    const s = st(r); by[s.accepted ? 'accepted' : (s.disp || 'open')] += r.diff; recovered += num(s.rec);
    for (const [d, a] of r.fl) ch[d] = (ch[d] || 0) + a;
  }
  Object.keys(by).forEach(k => { by[k] = r2(by[k]); });
  const byCharge = {};
  Object.entries(ch).sort((a, b) => b[1] - a[1]).slice(0, 12).forEach(([d, a]) => { byCharge[d.replace(/[.$#\[\]\/]/g, ' ')] = r2(a); });
  return { billed: r2(billed), quoted: r2(S.rows.reduce((t, r) => t + r.quote, 0)), shipments: S.rows.length, overCount: over.length,
           overTotal: r2(over.reduce((t, r) => t + r.diff, 0)), by, byCharge, recovered: r2(recovered) };
}
let sumTimer = null, sumWriting = false;
function scheduleSum() {
  clearTimeout(sumTimer);
  sumTimer = setTimeout(async () => {
    if (!db || !S.id || !canWrite || S.busy) return;
    if (sumWriting) { scheduleSum(); return; }
    const meta = S.audits.find(a => a.id === S.id) || {};
    const sum = computeSum(), tol = num($('tol').value), inclAcc = $('inclAcc').checked;
    if (!S.rows.length && !meta.sum && tol === (meta.tol ?? 0.5) && inclAcc === !!meta.inclAcc) return;
    if (stable(meta.sum || null) === stable(sum) && meta.tol === tol && meta.inclAcc === inclAcc) return;
    sumWriting = true;
    try { await db.doc(`audits/${S.id}`).update({ sum, tol, inclAcc }); } catch (e) {} finally { sumWriting = false; }
  }, 800);
}

  const before = $('tol').value + '|' + $('inclAcc').checked;
  if (ae !== $('tol')) $('tol').value = tol === null ? '0.50' : String(tol);
  if (ae !== $('inclAcc')) $('inclAcc').checked = !!(meta && meta.inclAcc);
  return before !== $('tol').value + '|' + $('inclAcc').checked;
}
function setView(v) {
  S.view = v;
  $('home').hidden = v !== 'home'; $('auditView').hidden = v !== 'audit';
  document.querySelectorAll('#nav [data-v]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === v)));
  if (v === 'home') renderHome(); else render();
  window.scrollTo(0, 0);
}
const STAT = [['open', 'To dispute', 'var(--c-over)'], ['accepted', 'Accepted', 'var(--c-spent)'], ['filed', 'Filed with FedEx', 'var(--c-ok)'], ['refunded', 'Refunded', 'var(--c-warn)'], ['rejected', 'Rejected', 'var(--c-pink)']];
const tipAttr = t => ` data-tip="${esc(t)}"`;
function renderHome() {
  const el = $('home'); if (S.view !== 'home') return;
  const all = S.audits;
  if (!all.length) {
    el.innerHTML = `<div class="card empty"><b>No audits yet.</b><br>An audit compares one set of FedEx invoices with what ShipRush quoted.<br><br><button id="hNew">Start your first audit</button></div>`;
    $('hNew').onclick = () => { setView('audit'); $('newBtn').click(); }; return;
  }
  const years = [...new Set(all.map(a => a.year).filter(Boolean))].sort((a, b) => a - b);
  const yr = S.homeYear !== 'all' && years.includes(S.homeYear) ? S.homeYear : 'all';
  const sel = all.filter(a => yr === 'all' || a.year === yr);
  const sm = a => a.sum || null, hasSum = all.some(sm);
  const sumOf = (list, f) => list.reduce((t, a) => t + (sm(a) ? f(sm(a)) : 0), 0);
  const spent = sumOf(sel, x => num(x.billed)), over = sumOf(sel, x => num(x.overTotal)), rec = sumOf(sel, x => num(x.recovered));
  const pend = sumOf(sel, x => num(x.by && x.by.open) + num(x.by && x.by.filed));
  const pct = (a, b) => b > 0 ? (a / b * 100).toFixed(1) + '%' : '0%';
  const yearLabel = yr === 'all' ? 'all years' : String(yr);

  // Chart A: spent by year, overcharged part on top
  const ys = years.map(y => { const l = all.filter(a => a.year === y); return { y, spent: sumOf(l, x => num(x.billed)), over: sumOf(l, x => num(x.overTotal)), n: l.length }; });
  const maxS = Math.max(1, ...ys.map(d => d.spent));
  const colsA = ys.map(d => {
    const H = 150, h = Math.max(d.spent > 0 ? 4 : 0, d.spent / maxS * H), ho = d.over > 0 ? Math.max(3, d.over / maxS * H) : 0;
    const op = yr === 'all' || yr === d.y ? 1 : .35;
    const tip = `${d.y}\nSpent with FedEx: ${money(d.spent)}\nOvercharged: ${money(d.over)} (${pct(d.over, d.spent)})\n${d.n} audit${d.n === 1 ? '' : 's'}`;
    return `<button class="colw" data-year="${d.y}" aria-pressed="${yr === d.y}"${tipAttr(tip)} aria-label="${esc(d.y + ': spent ' + usd(d.spent) + ', overcharged ' + usd(d.over))}">
      <span class="val">${usd(d.spent)}</span>
      <span class="bars" style="height:${h}px;opacity:${op}">${ho ? `<span class="seg top" style="height:${ho}px;background:var(--c-over)"></span>` : ''}<span class="seg ${ho ? '' : 'top'}" style="flex:1;background:var(--c-spent)"></span></span>
      <span class="lbl">${d.y}</span><span class="sub">${usd(d.over)} over · ${pct(d.over, d.spent)}</span></button>`;
  }).join('');

  // Chart B: overcharge rate per audit
  const auds = all.filter(a => sm(a) && num(sm(a).billed) > 0).slice().sort((a, b) => String(a.createdAt).localeCompare(String(b.createdAt)));
  const rate = a => num(sm(a).overTotal) / num(sm(a).billed) * 100, maxR = Math.max(0.1, ...auds.map(rate));
  const colsB = auds.map(a => {
    const h = Math.max(3, rate(a) / maxR * 120), tip = `${a.name}\nOvercharged ${money(num(sm(a).overTotal))} of ${money(num(sm(a).billed))} spent (${rate(a).toFixed(1)}%)`;
    return `<div class="colw"${tipAttr(tip)}><span class="val">${rate(a).toFixed(1)}%</span><span class="bars" style="height:${h}px"><span class="seg top" style="flex:1;background:var(--c-over)"></span></span><span class="lbl">${esc(a.name)}</span><span class="sub">${usd(num(sm(a).overTotal))} of ${usd(num(sm(a).billed))}</span></div>`;
  }).join('');

  // Chart C: what happened to the overcharges
  const by = k => sumOf(sel, x => num(x.by && x.by[k]));
  const tot = STAT.reduce((t, [k]) => t + by(k), 0);
  const stackC = tot > 0 ? `<div class="stackbar" role="img" aria-label="Overcharges by status">${STAT.filter(([k]) => by(k) > 0).map(([k, l, c]) => `<span class="seg" style="flex:${by(k)};background:${c}"${tipAttr(l + ': ' + money(by(k)) + ' (' + pct(by(k), tot) + ')')}></span>`).join('')}</div>` : '<p>No overcharges in this range.</p>';
  const rowsC = STAT.map(([k, l, c]) => `<div class="lrow"><i style="background:${c}"></i><span>${l}</span><span class="num">${money(by(k))}</span><span class="pc">${pct(by(k), tot)}</span></div>`).join('');

  // Chart D: where the extra charges come from
  const chg = {};
  sel.forEach(a => { const b = sm(a) && sm(a).byCharge; if (b) Object.entries(b).forEach(([d, v]) => { chg[d] = (chg[d] || 0) + num(v); }); });
  const top = Object.entries(chg).sort((a, b) => b[1] - a[1]).slice(0, 6), maxD = Math.max(1, ...top.map(x => x[1]));
  const rowsD = top.map(([d, v]) => `<div class="hrow"${tipAttr(d + ': ' + money(v))}><span class="name">${esc(d)}</span><span class="track"><span class="fill" style="display:block;width:${v / maxD * 100}%;background:var(--c-over)"></span></span><span class="num">${usd(v)}</span></div>`).join('');

  // Audit cards, grouped by year
  const group = [...new Set(sel.map(a => a.year || 0))].sort((a, b) => b - a);
  const cards = group.map(y => `<div class="yeargroup"><h3>${y || 'No year'}</h3><div class="acards">${sel.filter(a => (a.year || 0) === y).map(a => {
    const x = sm(a), d = (a.createdAt || '').slice(0, 10);
    return `<div class="acard"><div><div class="nm">${esc(a.name)}</div><div class="meta">${x ? x.shipments + ' shipments compared' : 'Totals not calculated yet'}${d ? ' · started ' + d : ''}</div></div>
      ${x ? `<div class="nums"><div><span>Spent</span><b>${usd(num(x.billed))}</b></div><div><span>Overcharged</span><b>${usd(num(x.overTotal))}</b></div>
        <div><span>To dispute</span><b>${usd(num(x.by && x.by.open) + num(x.by && x.by.filed))}</b></div><div><span>Recovered</span><b>${usd(num(x.recovered))}</b></div></div>` : '<div class="note">Open this audit once and its totals will appear here.</div>'}
      <button class="go ghost" data-open="${esc(a.id)}">Open audit</button></div>`; }).join('')}</div></div>`).join('');

  const tableRows = sel.map(a => { const x = sm(a); return `<tr><td>${esc(a.name)}</td><td>${a.year || ''}</td>${x ? `<td class="num">${money(num(x.billed))}</td><td class="num">${money(num(x.quoted))}</td><td class="num">${money(num(x.overTotal))}</td><td class="num">${pct(num(x.overTotal), num(x.billed))}</td><td class="num">${money(num(x.by && x.by.open) + num(x.by && x.by.filed))}</td><td class="num">${money(num(x.by && x.by.accepted))}</td><td class="num">${money(num(x.recovered))}</td>` : '<td colspan="7">Not calculated yet</td>'}</tr>`; }).join('');

  el.innerHTML = `
    <div class="hhead"><h2>Your FedEx history, ${yearLabel}</h2>
      <div class="bar"><div class="chips" id="yearChips"><button class="chip" data-y="all" aria-pressed="${yr === 'all'}">All years</button>${years.slice().reverse().map(y => `<button class="chip" data-y="${y}" aria-pressed="${yr === y}">${y}</button>`).join('')}</div>
      <button id="hNew">New audit</button></div></div>
    ${hasSum ? '' : '<div class="banner">Your saved audits will show up here with totals after you open each one once.</div>'}
    <div class="tiles">
      <div class="tile"><div class="k">Spent with FedEx</div><div class="v">${usd(spent)}</div><div class="d">Total billed on your invoices</div></div>
      <div class="tile"><div class="k">Overcharged</div><div class="v">${usd(over)}</div><div class="d">${pct(over, spent)} of spend: billed above what ShipRush quoted</div></div>
      <div class="tile"><div class="k">Still to dispute</div><div class="v">${usd(pend)}</div><div class="d">Not yet accepted, refunded or rejected</div></div>
      <div class="tile"><div class="k">Recovered</div><div class="v">${usd(rec)}</div><div class="d">Refunds you have logged</div></div>
    </div>
    <div class="charts">
      <div class="panel"><h2>Spent by year</h2><p>Each bar is a year of FedEx spend. The orange part is what was billed above the ShipRush quote. Click a year to focus on it.</p>
        <div class="legend"><span><i style="background:var(--c-spent)"></i>Billed as quoted</span><span><i style="background:var(--c-over)"></i>Overcharged</span></div>
        <div class="cols" role="img" aria-label="Spent by year: ${esc(ys.map(d => d.y + ' ' + usd(d.spent) + ' with ' + usd(d.over) + ' overcharged').join('; '))}">${colsA}</div></div>
      <div class="panel"><h2>Overcharge rate for each audit</h2><p>The share of the spend that was overcharged. A tall bar means that audit needs a closer look.</p>
        ${auds.length > 1 ? `<div class="cols" role="img" aria-label="Overcharge rate per audit">${colsB}</div>` : '<p>Add a second audit to compare them side by side.</p>'}</div>
      <div class="panel"><h2>What happened to the overcharges</h2><p>${money(tot)} overcharged in ${yearLabel}.</p>${stackC}<div class="lrows">${rowsC}</div></div>
      <div class="panel"><h2>Where the extra charges come from</h2><p>The FedEx charges behind the overcharges, biggest first. Fixing these at the source saves the most.</p>
        <div class="hbars">${rowsD || '<p>No charge details yet.</p>'}</div></div>
    </div>
    <div class="hhead"><h2>All audits</h2></div>${cards}
    <details class="tbl panel"><summary>Show the numbers as a table</summary><div class="scroll"><table><thead><tr><th>Audit</th><th>Year</th><th class="num">Spent</th><th class="num">Quoted</th><th class="num">Overcharged</th><th class="num">Rate</th><th class="num">To dispute</th><th class="num">Accepted</th><th class="num">Recovered</th></tr></thead><tbody>${tableRows}</tbody></table></div></details>`;
}
/* hover tooltip for charts */
const tip = $('tip');
function showTip(e) {
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (!t) { tip.hidden = true; return; }
  tip.textContent = t.dataset.tip; tip.hidden = false;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, e.clientX + 12)) + 'px';
  tip.style.top = Math.max(8, Math.min(window.innerHeight - h - 8, e.clientY + 14)) + 'px';
}
$('home').addEventListener('pointermove', showTip);
$('home').addEventListener('pointerleave', () => { tip.hidden = true; });
$('home').addEventListener('click', e => {
  const y = e.target.closest('[data-y]'), c = e.target.closest('[data-year]'), o = e.target.closest('[data-open]');
  if (y) { S.homeYear = y.dataset.y === 'all' ? 'all' : Number(y.dataset.y); renderHome(); }
  else if (c) { const n = Number(c.dataset.year); S.homeYear = S.homeYear === n ? 'all' : n; renderHome(); }
  else if (o) { openAudit(o.dataset.open).then(() => { renderPicker(); setView('audit'); }); }
  else if (e.target.id === 'hNew') { setView('audit'); $('newBtn').click(); }
});
$('nav').onclick = e => { const b = e.target.closest('[data-v]'); if (b) setView(b.dataset.v); };

/* ---------- events ---------- */
$('chips').onclick = e => { const b = e.target.closest('[data-f]'); if (b) { S.filter = b.dataset.f; render(); } };
$('tbl').onclick = e => { const th = e.target.closest('th'); if (th) { const k = th.dataset.k; S.sortDir = S.sortKey === k ? -S.sortDir : -1; S.sortKey = k; render(); } };
$('tbl').onchange = e => {
  const el = e.target, t = el.dataset.t, a = el.dataset.a; if (!t) return;
  if (a === 'acc') saveMark(t, { accepted: el.checked });
  else if (a === 'disp') saveMark(t, { disp: el.value });
  else if (a === 'rec') saveMark(t, { rec: el.value === '' ? null : num(el.value) });
  else if (a === 'note') saveMark(t, { note: el.value.trim() });
};
$('tol').oninput = () => { if (S.id) safeSet('fedexAudit.tol.' + S.id, $('tol').value); render(); scheduleSum(); };
$('inclAcc').onchange = () => scheduleSum();
$('tbl').addEventListener('focusout', () => { if (S.dirty) setTimeout(render, 0); });
const drop = $('drop');
drop.onclick = () => $('picker').click();
drop.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('picker').click(); } };
$('picker').onchange = e => { handleFiles([...e.target.files]); e.target.value = ''; };
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); handleFiles([...e.dataTransfer.files]); };

/* ---------- start ---------- */
(async () => {
  $('newYear').value = new Date().getFullYear();
  renderHome(); render();
  const c = window.claude;
  if (c && c.use) { try { db = await c.use('db'); userNS = await c.use('user'); dl = await c.use('downloads'); } catch (e) {} }
  if (userNS) {
    try { myId = userNS.id ? await userNS.id() : null; } catch (e) {}
    try { const w = await userNS.can('data.write'); if (w === false) canWrite = false; } catch (e) {}
    try { canAdmin = await userNS.canEdit(); } catch (e) {}
  }
  if (!canWrite) { $('banner').hidden = false; $('banner').textContent = 'You have view-only access. You can read this audit but not change it.'; }
  if (!db) {
    $('banner').hidden = false;
    $('banner').textContent = 'Not saved: this page could not reach its shared storage (are you signed in to Claude?). You can still compare files, but nothing is remembered.';
    await createAudit('Unsaved audit', new Date().getFullYear());
    return;
  }
  auditsCol().onSnapshot(snap => {
    S.audits = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
    if (S.id && !S.audits.some(a => a.id === S.id)) { S.id = null; }
    renderPicker();
    if (S.id && applySettings(S.audits.find(a => a.id === S.id))) render();
    renderHome();
  }, e => { $('msg').textContent = 'Could not load saved audits: ' + (e.message || e.code); });
})();
</script>
